<div class="flex min-h-[60px] flex-wrap items-center justify-center gap-2.5 px-2.5 py-1">

  @if(!this.editarTitulo){
    <h1 class="m-0 break-words text-center text-3xl font-bold leading-tight tracking-tight text-tinta [overflow-wrap:anywhere] sm:text-4xl">{{nombreOriginal}}</h1>
  }@else {
    <input class="campo max-w-[220px] text-lg font-semibold text-marca-texto [&.error]:border-peligro [&.error]:text-peligro" maxlength="20" [class.error]="mensajeNombreRepetido" (ngModelChange)="onTituloChange()" type="text" [attr.aria-label]="'favoritos.nombreLista' | translate" [(ngModel)]="tituloInput" >
    <small class="order-last w-full text-center text-sm text-peligro" [class.invisible]="!mensajeNombreRepetido">{{ 'favoritos.nombreExistente' | translate }}</small>
  }

  <div class="flex items-center gap-1.5">
    @if (!this.editarTitulo) {
      <button class="btn-icono border-marca bg-marca text-white hover:border-marca-oscuro hover:bg-marca-oscuro" (click)="cambiarEditarTitulo()" [attr.aria-label]="'favoritos.renombrar' | translate"><i class="material-icons" aria-hidden="true">edit</i></button>
      <button class="btn-icono border-marca bg-marca text-white hover:border-peligro hover:bg-peligro" (click)="mostrarPopUp=true" [attr.aria-label]="'favoritos.eliminarLista' | translate"><i class="material-icons" aria-hidden="true">delete</i></button>
    }@else {
      <button class="btn-icono border-marca bg-marca text-white hover:border-marca-oscuro hover:bg-marca-oscuro" (click)="guardarNuevoTitulo()" [attr.aria-label]="'favoritos.guardarNombre' | translate"><i class="material-icons" aria-hidden="true">check</i></button>
      <button class="btn-icono border-marca bg-marca text-white hover:border-peligro hover:bg-peligro" (click)="cancelarNuevoTitulo()" [attr.aria-label]="'favoritos.cancelarEdicion' | translate"><i class="material-icons" aria-hidden="true">close</i></button>
    }
  </div>
</div>

<app-pop-up-confirmar *ngIf="mostrarPopUp"
  [texto]="'favoritos.confirmarEliminarLista'"
  [parametros]="{ nombre: nombreOriginal }"
  (confirmar)="eliminarLista.emit()"
  (cancelar)="mostrarPopUp = false"
  >
</app-pop-up-confirmar>
