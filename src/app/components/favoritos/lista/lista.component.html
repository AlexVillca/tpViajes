<div class="mx-auto mb-10 mt-24 w-[92%] max-w-[1000px] space-y-6 text-tinta sm:mb-12 sm:mt-28">

  <div class="video-fondo">
    <video autoplay loop muted playsinline>
      <source src="assets/background-video.mp4" type="video/mp4" />
      Tu navegador no soporta reproducción de vídeos.
    </video>
  </div>

  <app-titulo-lista
    class="block"
    *ngIf="lista"
    (eliminarLista)="eliminarLista()"
    (nuevoTitulo)="guardarNuevoTitulo($event)"
    [nombreOriginal]="lista.nombreLista"
    [idUser]="this.idUsuario">
  </app-titulo-lista>

  <div class="space-y-6 motion-safe:animate-aparecer">
    <div class="estado" *ngIf="cargando" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p class="m-0">Cargando ciudades guardadas...</p>
    </div>

    <p class="aviso-error" *ngIf="errorCarga && !cargando" role="alert">{{ errorCarga }}</p>

    <p class="estado font-medium" *ngIf="!cargando && !errorCarga && listaImagenes.length === 0" role="status">
      Esta lista aun no tiene ciudades guardadas.
    </p>

    <div class="grid grid-cols-1 items-start gap-5 sm:grid-cols-2 lg:grid-cols-3" *ngIf="!cargando && !errorCarga && listaImagenes.length > 0">

      @for(l of listaImagenes;track  l.ciudad.codigoPais + l.ciudad.nombre){
        <app-card
          class="block min-w-0"
          [eliminable]="true"
          [arregloImagenes]="l.imagenes"
          [titulo]="l.ciudad.nombre"
          (click) ="accederCiudad(l.ciudad)"
          (borrar)="eliminarDeLaLista(l.ciudad)"
        ></app-card>
      }

    </div>

    <div class="flex justify-center">
      <button type="button" class="btn btn-primario px-6" (click)="volver()">Volver</button>
    </div>

  </div>
</div>
