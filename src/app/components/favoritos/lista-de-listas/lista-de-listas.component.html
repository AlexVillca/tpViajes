<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="video-background">
  <video autoplay loop muted playsinline class="background-video" (loadeddata)="onVideoLoaded()">
    <source src="assets/background-video.mp4" type="video/mp4" />
    Tu navegador no soporta reproducción de vídeos.
  </video>
  </div>

  <div class="div-central"  [class.visible]="containerVisible">
    <div class="estado-carga" *ngIf="cargando">
      <div class="spinner"></div>
      <p class="estado">Cargando tus listas...</p>
    </div>

    <p class="error" *ngIf="errorCarga && !cargando">{{ errorCarga }}</p>

    <p class="estado-vacio" *ngIf="!cargando && !errorCarga && listas.length === 0">
      Aun no tenes listas guardadas.
    </p>

    <div class="div-cards" *ngIf="!cargando && !errorCarga && listas.length > 0">
        @for(l of listas;track $index){
          <app-card [arregloImagenes]="l.imagenes" [titulo]="l.nombre" (click) = "accederLista(l.id)"></app-card>
        }
    </div>

    <button type="button" class="button-volver" (click)="volver()">Volver</button>
  </div>
</body>
</html>
