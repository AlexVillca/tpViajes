<div class="app-comentarios-container" *ngIf="flag">
  <app-comentarios (emitirComentario)="agregarComentarioDb($event)"></app-comentarios>
</div>

<div class="container">
  <h1>Lista de comentarios</h1>

  <div class="estado-carga" *ngIf="cargando">
    <div class="spinner"></div>
    <p class="estado">Cargando comentarios...</p>
  </div>

  <p class="error" *ngIf="errorCarga && !cargando">{{ errorCarga }}</p>

  <p class="estado-vacio" *ngIf="!cargando && !errorCarga && getComentariosDeCiudadActual().length === 0">
    Aun no hay comentarios
  </p>

  <ul *ngIf="!cargando && !errorCarga && getComentariosDeCiudadActual().length > 0">
    <li *ngFor="let comentarioActual of getComentariosDeCiudadActual()">
      <div class="comentario-container">
        <strong>{{ comentarioActual.usuario }}:</strong>

        <ng-container *ngIf="comentarioEnEdicionId !== comentarioActual.id; else edicionTpl">
          {{ comentarioActual.mensaje }}
        </ng-container>

        <ng-template #edicionTpl>
          <div class="edicion-comentario">
            <input
              type="text"
              [(ngModel)]="mensajeEditado"
              maxlength="200"
              class="input-edicion"
              aria-label="Editar comentario"
            />
            <small class="error" *ngIf="errorEdicion">{{ errorEdicion }}</small>
          </div>
        </ng-template>

        <div class="acciones-comentario" *ngIf="esComentarioPropio(comentarioActual)">
          <button
            type="button"
            *ngIf="comentarioEnEdicionId !== comentarioActual.id"
            (click)="iniciarEdicion(comentarioActual)"
          >
            Editar
          </button>

          <button
            type="button"
            *ngIf="comentarioEnEdicionId === comentarioActual.id"
            (click)="guardarEdicion(comentarioActual)"
          >
            Guardar
          </button>

          <button
            type="button"
            *ngIf="comentarioEnEdicionId === comentarioActual.id"
            (click)="cancelarEdicion()"
          >
            Cancelar
          </button>

          <button
            type="button"
            *ngIf="comentarioEnEdicionId !== comentarioActual.id"
            (click)="pedirEliminar(comentarioActual)"
          >
            Eliminar
          </button>
        </div>
      </div>
    </li>
  </ul>
</div>

<app-pop-up-confirmar
  *ngIf="comentarioAEliminar"
  [texto]="'¿Eliminar este comentario?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="cancelarEliminar()"
></app-pop-up-confirmar>
