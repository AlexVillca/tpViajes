<form [formGroup]="formulario" (ngSubmit)="agregarComentarioDb()">

  <div class="flex flex-col gap-2 sm:flex-row">
    <input class="campo sm:flex-1" type="text" formControlName="comentario" placeholder="Ingresa tu comentario aqui" aria-label="Comentario">
    <button class="btn btn-primario shrink-0">Agregar</button>
  </div>

  <div class="mensaje-error" *ngIf="formulario.controls['comentario'].getError('required') && formulario.controls['comentario'].touched">
    El comentario es obligatorio
  </div>

  <div class="mensaje-error" *ngIf="formulario.controls['comentario'].getError('minlength') && formulario.controls['comentario'].touched">
    Debe tener 3 letras o mas
  </div>

  <div class="mensaje-error" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

</form>
