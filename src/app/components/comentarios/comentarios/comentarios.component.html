<div class="container">

  <form [formGroup]="formulario" (ngSubmit)="agregarComentarioDb()">


      <input type="text" formControlName="comentario" placeholder="Ingresa tu comentario aqui" aria-label="Comentario">

      <div class="error" *ngIf="formulario.controls['comentario'].getError('required') && formulario.controls['comentario'].touched">
        El comentario es obligatorio
      </div>

      <div class="error" *ngIf="formulario.controls['comentario'].getError('minlength') && formulario.controls['comentario'].touched">
        Debe tener 3 letras o mas
      </div>

      <div class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button>Agregar</button>

  </form>

</div>
