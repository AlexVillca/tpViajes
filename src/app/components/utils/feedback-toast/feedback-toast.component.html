<div class="fixed right-4 top-[76px] z-[1500] max-[768px]:left-4" *ngIf="feedback.message$ | async as message">
  <div
    class="flex min-w-[260px] max-w-[min(360px,calc(100vw-32px))] items-center justify-between gap-3 rounded-lg px-3.5 py-3 text-white shadow-[0_8px_24px_rgba(0,0,0,0.25)] max-[768px]:w-full max-[768px]:min-w-0"
    [ngClass]="{
      'bg-exito': message.type === 'success',
      'bg-peligro': message.type === 'error',
      'bg-marca-oscuro': message.type === 'info'
    }"
    role="status"
    [attr.aria-live]="message.type === 'error' ? 'assertive' : 'polite'"
  >
    <span class="text-sm leading-[1.4]">{{ message.text | translate }}</span>
    <button
      type="button"
      class="cursor-pointer border-0 bg-transparent p-0 text-lg leading-none text-inherit focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      (click)="feedback.clear()"
      [attr.aria-label]="'aviso.cerrar' | translate"
    >
      ×
    </button>
  </div>
</div>
