<main class="contenedor-pagina mb-8 mt-[88px] text-tinta">
  <h1 class="m-0 mb-1 border-0 border-l-4 border-solid border-marca pl-3 text-3xl font-bold">{{ 'explorar.titulo' | translate }}</h1>
  <p class="m-0 mb-5 pl-3 text-sm text-tinta-suave">{{ 'explorar.subtitulo' | translate }}</p>

  <div class="relative z-[500] mb-4">
    <app-buscador-ciudades [paises]="paises"></app-buscador-ciudades>
  </div>

  <div class="mb-4 flex flex-wrap gap-2" role="group" [attr.aria-label]="'explorar.filtroContinente' | translate">
    <button type="button" (click)="filtrar('todos')" [attr.aria-pressed]="continenteSeleccionado === 'todos'"
      class="rounded-xl border border-solid px-3 py-1.5 text-sm font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-marca-foco"
      [ngClass]="continenteSeleccionado === 'todos' ? 'border-marca bg-marca text-white' : 'border-superficie-borde bg-white text-tinta-media hover:bg-superficie-clara'">
      {{ 'explorar.todos' | translate }}
    </button>
    <button *ngFor="let c of continentes" type="button" (click)="filtrar(c)" [attr.aria-pressed]="continenteSeleccionado === c"
      class="rounded-xl border border-solid px-3 py-1.5 text-sm font-semibold transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-marca-foco"
      [ngClass]="continenteSeleccionado === c ? 'border-marca bg-marca text-white' : 'border-superficie-borde bg-white text-tinta-media hover:bg-superficie-clara'">
      {{ claveContinente(c) | translate }}
    </button>
  </div>

  <p *ngIf="error" class="m-0 mb-3 text-sm text-peligro" role="alert">{{ error | translate }}</p>
  <p *ngIf="cargando" class="m-0 py-6 text-center text-sm text-tinta-suave">{{ 'explorar.cargando' | translate }}</p>

  <div *ngIf="!cargando && paises.length" class="flex flex-col gap-4 lg:flex-row lg:items-stretch">
    <!-- Mapa -->
    <div class="min-w-0 lg:flex-1">
      <app-mapa-paises [paises]="paisesVisibles" (seleccionar)="abrirPais($event)"></app-mapa-paises>
    </div>

    <!-- Lista accesible de países: alternativa por teclado/lector de pantalla, en panel compacto -->
    <aside class="lg:w-[250px] lg:shrink-0" [attr.aria-label]="'explorar.listaPaises' | translate">
      <div class="flex h-full flex-col overflow-hidden rounded-2xl border border-solid border-superficie-linea bg-white/70">
        <div class="flex items-baseline justify-between gap-2 border-0 border-b border-solid border-superficie-linea px-3 py-2">
          <h2 class="m-0 text-xs font-bold uppercase tracking-wide text-tinta-suave">{{ 'explorar.listaPaises' | translate }}</h2>
          <span class="text-xs font-semibold tabular-nums text-tinta-suave">{{ paisesVisibles.length }}</span>
        </div>
        <ul class="m-0 max-h-[32vh] list-none overflow-y-auto px-1.5 py-1.5 lg:max-h-none lg:flex-1">
          <li *ngFor="let p of paisesLista">
            <button type="button" (click)="abrirPais(p)"
              class="block w-full truncate rounded-lg border-0 bg-transparent px-2.5 py-1.5 text-left text-[13px] font-medium text-tinta-media transition-colors hover:bg-superficie-clara hover:text-marca-texto focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-marca-foco">
              {{ nombre(p) }}
            </button>
          </li>
        </ul>
      </div>
    </aside>
  </div>
</main>
