<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista Paises</title>
</head>
<body>
  <div class="video-background">
    <video autoplay loop muted playsinline class="background-video" (loadeddata)="onVideoLoaded()">
      <source src="assets/background-video.mp4" type="video/mp4" />
      Tu navegador no soporta reproducción de vídeos.
    </video>
  </div>

  <div class="contenedor">

    <div class="abecedario">
      <a role="button" tabindex="0" (click)="filtrarPaises('todos')" (keyup.enter)="filtrarPaises('todos')">Todos</a>
      <a *ngFor="let letra of letras" role="button" tabindex="0" (click)="filtrarPaises(letra)" (keyup.enter)="filtrarPaises(letra)">{{ letra }}</a>
    </div>

    <div class="estado-carga" *ngIf="cargando">
      <div class="spinner"></div>
      <p class="estado">Cargando paises...</p>
    </div>

    <p class="error" *ngIf="errorCarga && !cargando">{{ errorCarga }}</p>

    <p class="estado-vacio" *ngIf="!cargando && !errorCarga && paisesFiltrados.length === 0">
      {{ mensajeVacio }}
    </p>

    <ul *ngIf="!cargando && !errorCarga && paisesFiltrados.length > 0">
      <li *ngFor="let pais of paisesPagina">
        <a role="button" tabindex="0" (click)="seleccionarPais(pais)" (keyup.enter)="seleccionarPais(pais)">{{ pais.nombre }}  </a>
      </li>
    </ul>

    <div class="paginacion" *ngIf="!cargando && !errorCarga && totalPaginas > 1">
      <button type="button" (click)="paginaAnterior()" [disabled]="paginaActual === 1" aria-label="Página anterior">‹ Anterior</button>
      <span class="pagina-indicador">Página {{ paginaActual }} de {{ totalPaginas }}</span>
      <button type="button" (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas" aria-label="Página siguiente">Siguiente ›</button>
    </div>

  </div>

</body>
</html>
