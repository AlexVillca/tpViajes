  <main class="contenedor mx-auto mb-8 mt-[88px] w-[calc(100%-2rem)] max-w-[1280px] translate-y-5 text-[#123a53] opacity-0 transition-[opacity,transform] duration-[600ms] ease-out motion-reduce:transform-none motion-reduce:transition-none sm:w-[calc(100%-3rem)] [&.visible]:translate-y-0 [&.visible]:opacity-100" aria-labelledby="paises-title">
    <header class="mb-4 flex items-center gap-3">
      <span class="h-10 w-1 shrink-0 rounded-full bg-gradient-to-b from-[#1E85BB] to-[#14b8b3]" aria-hidden="true"></span>
      <h1 id="paises-title" class="m-0 text-3xl font-bold leading-tight tracking-tight sm:text-4xl">Lista Países</h1>
    </header>

    <div class="mb-4 rounded-3xl border border-solid border-white/80 bg-white/80 p-3 shadow-[0_8px_30px_rgba(22,78,110,0.07)] backdrop-blur-xl sm:p-4">
      <div class="flex flex-wrap justify-center gap-1.5 sm:gap-2" role="group" aria-label="Filtrar países por inicial">
        <a class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-xl border border-solid border-[#cce4ec] bg-white px-2 py-1 text-xs font-semibold text-[#365c70] no-underline transition-colors duration-200 hover:border-[#149eae] hover:bg-[#e7f6f8] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#087d9b] aria-pressed:border-[#1685a8] aria-pressed:bg-[#1685a8] aria-pressed:text-white aria-pressed:shadow-sm hover:aria-pressed:bg-[#126b9b] motion-reduce:transition-none sm:px-3 sm:py-2 sm:text-sm" role="button" tabindex="0" [attr.aria-pressed]="letraSeleccionada === 'todos'" (click)="filtrarPaises('todos')" (keyup.enter)="filtrarPaises('todos')">Todos</a>
        <a class="inline-flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-xl border border-solid border-[#cce4ec] bg-white px-2 py-1 text-xs font-semibold text-[#365c70] no-underline transition-colors duration-200 hover:border-[#149eae] hover:bg-[#e7f6f8] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#087d9b] aria-pressed:border-[#1685a8] aria-pressed:bg-[#1685a8] aria-pressed:text-white aria-pressed:shadow-sm hover:aria-pressed:bg-[#126b9b] motion-reduce:transition-none sm:px-3 sm:py-2 sm:text-sm" *ngFor="let letra of letras" role="button" tabindex="0" [attr.aria-pressed]="letraSeleccionada === letra" (click)="filtrarPaises(letra)" (keyup.enter)="filtrarPaises(letra)">{{ letra }}</a>
      </div>
    </div>

    <div class="my-6 flex flex-col items-center gap-3 rounded-2xl border border-solid border-white/80 bg-white/80 p-8 text-center shadow-sm" *ngIf="cargando" role="status" aria-live="polite">
      <div class="h-9 w-9 animate-spin rounded-full border-4 border-solid border-[#d5ebf1] border-t-[#149eae] [animation-duration:800ms] motion-reduce:animate-none" aria-hidden="true"></div>
      <p class="m-0 text-[15px] font-semibold text-[#416277]">Cargando paises...</p>
    </div>

    <p class="my-6 rounded-2xl border border-solid border-[#f3c7c2] bg-[#fff4f2] px-5 py-6 text-center text-[15px] font-semibold leading-relaxed text-[#9d291f]" *ngIf="errorCarga && !cargando" role="alert">{{ errorCarga }}</p>

    <p class="my-6 rounded-2xl border border-solid border-white/80 bg-white/80 px-5 py-8 text-center text-[15px] font-semibold leading-relaxed text-[#416277]" *ngIf="!cargando && !errorCarga && paisesFiltrados.length === 0" role="status">
      {{ mensajeVacio }}
    </p>

    <ul class="m-0 grid list-none grid-cols-1 gap-3 p-0 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" *ngIf="!cargando && !errorCarga && paisesFiltrados.length > 0" aria-labelledby="paises-title">
      <li class="min-w-0" *ngFor="let pais of paisesPagina">
        <a class="group flex h-full min-h-[72px] cursor-pointer items-center justify-between gap-4 rounded-2xl border border-solid border-white/90 bg-white/85 px-4 py-4 text-left text-[17px] font-semibold leading-snug text-[#123a53] no-underline shadow-[0_4px_18px_rgba(22,78,110,0.06)] backdrop-blur-md transition-all duration-200 hover:-translate-y-0.5 hover:border-[#14b8b3]/50 hover:bg-white hover:shadow-[0_8px_24px_rgba(22,78,110,0.12)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087d9b] active:translate-y-0 motion-reduce:transform-none motion-reduce:transition-none" role="button" tabindex="0" (click)="seleccionarPais(pais)" (keyup.enter)="seleccionarPais(pais)">
          <span class="min-w-0 break-words [overflow-wrap:anywhere]">{{ pais.nombre }}</span>
          <svg class="h-5 w-5 shrink-0 text-[#1685a8] transition-transform duration-200 group-hover:translate-x-1 motion-reduce:transform-none motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </a>
      </li>
    </ul>

    <nav class="mt-4 grid min-w-0 grid-cols-2 items-center gap-3 rounded-2xl border border-solid border-white/80 bg-white/80 p-3 shadow-sm backdrop-blur-md sm:grid-cols-[auto_minmax(0,auto)_auto] sm:justify-center sm:p-4" *ngIf="!cargando && !errorCarga && totalPaginas > 1" aria-label="Paginación de países">
      <button class="inline-flex min-h-11 min-w-0 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-[#1685a8] bg-[#1685a8] px-4 py-2 text-sm font-bold text-white transition-colors duration-200 hover:enabled:border-[#126b9b] hover:enabled:bg-[#126b9b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087d9b] disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none" type="button" (click)="paginaAnterior()" [disabled]="paginaActual === 1" aria-label="Página anterior">‹ Anterior</button>
      <span class="col-span-2 row-start-2 min-w-0 break-words text-center text-sm font-semibold tabular-nums text-[#365c70] sm:col-span-1 sm:col-start-2 sm:row-start-1" aria-live="polite" aria-atomic="true">Página {{ paginaActual }} de {{ totalPaginas }}</span>
      <button class="inline-flex min-h-11 min-w-0 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-[#1685a8] bg-[#1685a8] px-4 py-2 text-sm font-bold text-white transition-colors duration-200 hover:enabled:border-[#126b9b] hover:enabled:bg-[#126b9b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087d9b] disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none sm:col-start-3" type="button" (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas" aria-label="Página siguiente">Siguiente ›</button>
    </nav>
  </main>
