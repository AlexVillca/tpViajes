<div class="mx-auto mb-10 mt-24 w-[92%] max-w-[480px] -translate-y-5 opacity-0 transition-[opacity,transform] duration-[600ms] ease-in-out [&.visible]:translate-y-0 [&.visible]:opacity-100 motion-reduce:transform-none motion-reduce:transition-none sm:mb-12 sm:mt-28" id="container" [class.visible]="containerVisible">
    <div class="rounded-3xl border border-solid border-white/80 bg-white/90 p-5 text-[#123a53] shadow-[0_8px_30px_rgba(22,78,110,0.07)] sm:p-8">
      <form class="space-y-5" [formGroup]="formularioUpdate" (ngSubmit)="update()">
        <h1 class="m-0 mb-6 text-2xl font-bold leading-tight tracking-tight sm:text-3xl">Actualizar Contrasena</h1>
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-[#365c70]" for="password">Nueva contraseña</label>
          <input class="min-h-12 w-full min-w-0 rounded-xl border border-solid border-[#cce4ec] bg-white px-4 py-3 text-base text-[#123a53] placeholder:text-[#647e8d] transition-colors hover:border-[#149eae] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#087d9b] [&.ng-invalid.ng-touched]:border-[#b42318] [&.invalid]:border-[#b42318] motion-reduce:transition-none"
            type="password"
            id="password"
            autocomplete="new-password"
            formControlName="password"
            placeholder="Nueva Contrasena"
            aria-label="Nueva contraseña"
            [class.invalid]="formularioUpdate.controls['password'].touched && formularioUpdate.controls['password'].invalid"
          />
          <div *ngIf="formularioUpdate.controls['password']?.invalid && (formularioUpdate.controls['password']?.dirty || formularioUpdate.controls['password']?.touched)">
            <div class="mt-2 text-sm leading-relaxed text-[#b42318]" *ngIf="formularioUpdate.controls['password']?.errors?.['required']">Ingrese una nueva contrasena</div>
            <div class="mt-2 text-sm leading-relaxed text-[#b42318]" *ngIf="formularioUpdate.controls['password']?.errors?.['minlength']">Contrasena debe tener al menos 8 caracteres</div>
            <div class="mt-2 text-sm leading-relaxed text-[#b42318]" *ngIf="formularioUpdate.controls['password']?.errors?.['maxlength']">Contrasena debe tener maximo 20 caracteres</div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-semibold text-[#365c70]" for="confirmPassword">Confirmar nueva contraseña</label>
          <input class="min-h-12 w-full min-w-0 rounded-xl border border-solid border-[#cce4ec] bg-white px-4 py-3 text-base text-[#123a53] placeholder:text-[#647e8d] transition-colors hover:border-[#149eae] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#087d9b] [&.ng-invalid.ng-touched]:border-[#b42318] [&.invalid]:border-[#b42318] motion-reduce:transition-none"
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            formControlName="confirmPassword"
            placeholder="Confirmar Nueva Contrasena"
            aria-label="Confirmar nueva contraseña"
            (input)="checkPasswordMatch()"
            [class.invalid]="formularioUpdate.controls['confirmPassword'].touched && formularioUpdate.controls['confirmPassword'].invalid"
          />
          <div class="mt-2 text-sm leading-relaxed text-[#b42318]" *ngIf="formularioUpdate.controls['confirmPassword'].invalid && (formularioUpdate.controls['confirmPassword']?.touched || formularioUpdate.controls['confirmPassword']?.dirty)">
            Debe volver a ingresar la nueva contrasena
          </div>
          <div class="mt-2 text-sm leading-relaxed text-[#b42318]" *ngIf="passwordNotMatch && (formularioUpdate.controls['confirmPassword']?.touched || formularioUpdate.controls['confirmPassword']?.dirty) && formularioUpdate.controls['confirmPassword'].valid">
            La contrasena no coincide
          </div>
        </div>

        <div *ngIf="successMessage" class="rounded-xl border border-solid border-[#b8e3e6] bg-[#e7f6f8] p-4 text-sm leading-relaxed text-[#176c8d]" role="status" aria-live="polite">
          {{ successMessage }}
        </div>

        <div *ngIf="serverError" class="mt-2 text-sm leading-relaxed text-[#b42318]">
          {{ serverError }}
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">
          <button class="inline-flex min-h-11 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-[#1685a8] bg-[#1685a8] px-5 py-3 text-sm font-bold text-white shadow-sm transition-colors duration-200 hover:enabled:border-[#126b9b] hover:enabled:bg-[#126b9b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087d9b] active:enabled:bg-[#0d577e] disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none sm:flex-1" type="submit" [disabled]="formularioUpdate.invalid">Actualizar</button>
          <button type="button" class="inline-flex min-h-11 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-[#1685a8] bg-[#1685a8] px-5 py-3 text-sm font-bold text-white shadow-sm transition-colors duration-200 hover:enabled:border-[#126b9b] hover:enabled:bg-[#126b9b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#087d9b] active:enabled:bg-[#0d577e] disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none sm:flex-1" (click)="volver()">Volver a mi perfil</button>
        </div>
      </form>
    </div>
  </div>
