<main class="mx-auto mb-10 mt-24 w-[92%] max-w-[480px] motion-safe:animate-aparecer sm:mb-12 sm:mt-28" id="container">
    <div class="rounded-3xl border border-solid border-white/80 bg-white/90 p-5 text-tinta shadow-[0_8px_30px_rgba(22,78,110,0.07)] sm:p-8">
      <form class="space-y-5" [formGroup]="formularioUpdate" (ngSubmit)="update()">
        <h1 class="m-0 mb-6 text-2xl font-bold leading-tight tracking-tight sm:text-3xl">Actualizar Contraseña</h1>
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-tinta-media" for="password">Nueva contraseña</label>
          <input class="min-h-12 w-full min-w-0 rounded-xl border border-solid border-superficie-borde bg-white px-4 py-3 text-base text-tinta placeholder:text-tinta-placeholder transition-colors hover:border-acento-medio focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-marca-foco [&.ng-invalid.ng-touched]:border-peligro [&.invalid]:border-peligro motion-reduce:transition-none"
            type="password"
            id="password"
            autocomplete="new-password"
            formControlName="password"
            placeholder="Nueva contraseña"
            aria-label="Nueva contraseña"
            [class.invalid]="formularioUpdate.controls['password'].touched && formularioUpdate.controls['password'].invalid"
          />
          <div *ngIf="formularioUpdate.controls['password']?.invalid && (formularioUpdate.controls['password']?.dirty || formularioUpdate.controls['password']?.touched)">
            <div class="mt-2 text-sm leading-relaxed text-peligro" *ngIf="formularioUpdate.controls['password']?.errors?.['required']">Ingrese una nueva contraseña</div>
            <div class="mt-2 text-sm leading-relaxed text-peligro" *ngIf="formularioUpdate.controls['password']?.errors?.['minlength']">La contraseña debe tener al menos 8 caracteres</div>
            <div class="mt-2 text-sm leading-relaxed text-peligro" *ngIf="formularioUpdate.controls['password']?.errors?.['maxlength']">La contraseña debe tener como máximo 20 caracteres</div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-semibold text-tinta-media" for="confirmPassword">Confirmar nueva contraseña</label>
          <input class="min-h-12 w-full min-w-0 rounded-xl border border-solid border-superficie-borde bg-white px-4 py-3 text-base text-tinta placeholder:text-tinta-placeholder transition-colors hover:border-acento-medio focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-marca-foco [&.ng-invalid.ng-touched]:border-peligro [&.invalid]:border-peligro motion-reduce:transition-none"
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            formControlName="confirmPassword"
            placeholder="Confirmar nueva contraseña"
            aria-label="Confirmar nueva contraseña"
            (input)="checkPasswordMatch()"
            [class.invalid]="formularioUpdate.controls['confirmPassword'].touched && formularioUpdate.controls['confirmPassword'].invalid"
          />
          <div class="mt-2 text-sm leading-relaxed text-peligro" *ngIf="formularioUpdate.controls['confirmPassword'].invalid && (formularioUpdate.controls['confirmPassword']?.touched || formularioUpdate.controls['confirmPassword']?.dirty)">
            Debe volver a ingresar la nueva contraseña
          </div>
          <div class="mt-2 text-sm leading-relaxed text-peligro" *ngIf="passwordNotMatch && (formularioUpdate.controls['confirmPassword']?.touched || formularioUpdate.controls['confirmPassword']?.dirty) && formularioUpdate.controls['confirmPassword'].valid">
            La contraseña no coincide
          </div>
        </div>

        <div *ngIf="successMessage" class="rounded-xl border border-solid border-superficie-resalte bg-superficie-clara p-4 text-sm leading-relaxed text-marca-texto" role="status" aria-live="polite">
          {{ successMessage }}
        </div>

        <div *ngIf="serverError" class="mt-2 text-sm leading-relaxed text-peligro">
          {{ serverError }}
        </div>

        <div class="flex flex-col gap-3 sm:flex-row">
          <button class="inline-flex min-h-11 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-marca bg-marca px-5 py-3 text-sm font-bold text-white shadow-sm transition-colors duration-200 hover:enabled:border-marca-oscuro hover:enabled:bg-marca-oscuro focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-marca-foco active:enabled:bg-marca-profundo disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none sm:flex-1" type="submit" [disabled]="formularioUpdate.invalid">Actualizar</button>
          <button type="button" class="inline-flex min-h-11 w-full cursor-pointer items-center justify-center rounded-xl border border-solid border-marca bg-marca px-5 py-3 text-sm font-bold text-white shadow-sm transition-colors duration-200 hover:enabled:border-marca-oscuro hover:enabled:bg-marca-oscuro focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-marca-foco active:enabled:bg-marca-profundo disabled:cursor-not-allowed disabled:opacity-50 motion-reduce:transition-none sm:flex-1" (click)="volver()">Volver a mi perfil</button>
        </div>
      </form>
    </div>
  </main>
